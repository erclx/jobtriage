name: Refresh Mock Fixtures

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-mock-fixtures
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh mock fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Capture mock fixtures
        working-directory: web
        run: bun run capture-mock

      - name: Open or update refresh PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(mock): refresh fixtures'
          title: 'chore(mock): refresh fixtures'
          body: |
            Auto-generated by the weekly `refresh-mock-fixtures` workflow.

            Re-captured live JobTech ads and dropped any that no longer return 200 on the ad-details endpoint.
          branch: bot/refresh-mock-fixtures
          base: main
          delete-branch: true
          add-paths: web/src/features/mock/scripts

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
