name: Refresh Mock Fixtures

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mock-fixtures
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh mock fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture mock fixtures
        run: bun run capture-mock

      - name: Commit refreshed fixtures
        run: |
          if git diff --quiet -- src/features/mock/scripts; then
            echo "No fixture changes. Skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/mock/scripts
          git commit -m "chore(mock): refresh fixtures"
          git push
